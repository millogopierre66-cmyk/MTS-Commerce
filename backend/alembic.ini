# Configuration Alembic pour MTS Commerce.
# IMPORTANT : migrations/env.py remplace sqlalchemy.url par settings.DATABASE_URL.
# Les commandes Alembic ciblent donc la base configuree pour l'application.
# Verifier DATABASE_URL et sauvegarder la base avant toute migration.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# L'URL est fournie par app.core.config.settings dans env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
